# Baseline foveate run on a COCO subset (coral or any category).
# Requires the [dino] extra and a downloaded COCO dataset; DINOv3 weights are HF-gated.
run_name: coco_baseline

backbone:
  type: dino
  model_id: facebook/dinov3-vits16-pretrain-lvd1689m
  image_size: 768

data:
  name: pannuke
  root: /data/robert/pannuke             # point at the directory containing images.npy + masks.npy
  categories: [] # or [] for all five classes; names are case-insensitive
  min_instances: 2
  train_images: 50                # intra pool (same-image discovery)
  interval_images: 20             # disjoint novel images for cross-image (inter) eval
  known_ratio: 0.3                # fraction of instances that are known/prompts; rest are GT
  seed: 42

foveate:               # any foveate.Config field
  standardize: true
  gate_threshold: 0.5
  border_mode: proto              # proto | otsu | static
  accept_mode: cls                # cls | proto | both
  min_crop: 64
  max_total_embeds: 512

eval:
  targets: [intra, inter]         # intra = same-image discovery; inter = cross-image (set debias: true)
  max_exemplars: 3
  limit: null
  visualize: 20                   # render prompt|GT|prediction overlays for the first N images
                                  #   (int caps count, true/"all" = every image, false = off);
                                  #   logged to MLflow under {intra,inter}/viz in the run's artifacts
  cascade_trace: 5                # contact sheet of the recursive zoom (gate/components/children)
                                  #   per region, for the first N images; same budget semantics

mlflow:
  enabled: true
  experiment_name: foveate-pannuke
  # Server connection — all optional; env vars from .env are used as fallback.
  # YAML values take precedence over the environment.
  tracking_uri: null              # overrides MLFLOW_TRACKING_URI; null -> ./mlruns
  username: null                  # overrides MLFLOW_TRACKING_USERNAME
  password: null                  # overrides MLFLOW_TRACKING_PASSWORD
  dotenv: null                    # explicit .env path; null -> looks for ./.env

sweep:
  foveate.gate_threshold_mode: [otsu, gmm2]
  foveate.prototype_reduction: [all, mean, cluster, kmeans]
  foveate.debias: [false, true]
  foveate.prototype_budget: [-1, 64, 512]
