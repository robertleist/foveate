# Offline smoke test: synthetic coloured-square dataset + weightless mock backbone.
# Runs end-to-end with no downloads and no DINOv3 weights:
#   python -m experiments.run --config configs/mock_smoke.yaml
run_name: mock_smoke

backbone:
  type: mock
  image_size: 224
  patch_size: 14

data:
  name: synthetic
  categories: []          # all colour categories
  min_instances: 2
  train_images: 6         # intra pool (same-image discovery)
  interval_images: 3      # disjoint novel images for cross-image (inter) eval
  known_ratio: 0.5
  seed: 0
  options:
    n_images: 9
    image_size: 128
    n_instances: 4
    n_categories: 2

foveate:
  standardize: false        # MockBackbone features are colour-based; z-scoring destroys the signal
  foreground_extractor: insid3   # insid3 (default) | bank
  insid3_tau: 0.6
  insid3_aggregate_threshold: 0.2
  insid3_crop_reference: true
  cls_threshold: 0.0        # mock CLS is coarse; don't filter leaves on it in the smoke test
  min_crop: 24
  cascade_min_instance_area: 4
  gate_threshold: 0.4       # bank extractor only
  prototype_reduction: all  # bank extractor only

eval:
  targets: [intra, inter]   # intra = same-image discovery; inter = cross-image
  max_exemplars: 2
  limit: null
  visualize: all            # int caps count, true/"all" renders every image, false disables
  cascade_trace: 2          # contact sheet of the recursive zoom (same budget semantics)

mlflow:
  enabled: false          # flip to true to log to ./mlruns
  experiment_name: foveate-smoke
