# Ablation: INSID3 clustering threshold x aggregation threshold, on the offline synthetic dataset.
# (Swap the sweep block for `foveate.foreground_extractor: [insid3, bank]` to compare strategies.)
#   python -m experiments.ablations --config configs/ablation_thresholds.yaml
run_name: ablation

backbone:
  type: mock
  image_size: 224
  patch_size: 14

data:
  name: synthetic
  categories: []
  min_instances: 2
  train_images: 6
  known_ratio: 0.5
  seed: 0
  options:
    n_images: 6
    image_size: 128
    n_instances: 4
    n_categories: 2

foveate:
  standardize: false        # MockBackbone features are colour-based; z-scoring destroys the signal
  foreground_extractor: insid3
  insid3_crop_reference: true
  cls_threshold: 0.0        # class FLOOR = 0 to isolate the foreground-extraction ablation
                            # (split_margin / split_aggregate / boundary_smooth_sigma at defaults)
  min_crop: 24
  cascade_min_instance_area: 4
  gate_threshold: 0.4       # bank extractor only

eval:
  max_exemplars: 2

mlflow:
  enabled: true
  experiment_name: foveate-ablations

sweep:
  foveate.insid3_tau: [0.5, 0.6, 0.7]
  foveate.insid3_aggregate_threshold: [0.1, 0.2, 0.3]
