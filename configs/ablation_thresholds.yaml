# Ablation: gate-threshold strategy x prototype reduction, on the offline synthetic dataset.
#   python -m experiments.ablations --config configs/ablation_thresholds.yaml
run_name: ablation
output_dir: runs/ablation

backbone:
  type: mock
  image_size: 224
  patch_size: 14

data:
  name: synthetic
  categories: []
  min_instances: 2
  train_images: 6
  known_ratio: 0.5
  seed: 0
  options:
    n_images: 6
    image_size: 128
    n_instances: 4
    n_categories: 2

foveate:
  standardize: false        # MockBackbone features are colour-based; z-scoring destroys the signal
  gate_threshold: 0.4
  min_crop: 24
  cascade_min_instance_area: 4

eval:
  max_exemplars: 2

mlflow:
  enabled: true
  experiment_name: foveate-ablations

sweep:
  foveate.gate_threshold_mode: [static, otsu]
  foveate.prototype_reduction: [all, kmeans]
