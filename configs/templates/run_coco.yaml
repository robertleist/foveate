# Baseline foveate run on a COCO subset (coral or any category).
# Requires the [dino] extra and a downloaded COCO dataset; DINOv3 weights are HF-gated.
run_name: coco_baseline

backbone:
  type: dino
  model_id: facebook/dinov3-vits16-pretrain-lvd1689m
  image_size: 768

data:
  name: coco
  label: coco                 # dataset name for MLflow logging/filtering
  root: /data/robert/coco
  annotation_file: annotations/instances_train2017.json
  images_dir: train2017
  categories: [person]
  min_instances: 2
  train_images: 20        # intra pool (same-image discovery)
  interval_images: 10     # disjoint novel images for cross-image (inter) eval
  known_ratio: 0.3        # fraction of instances used as known/prompts (intra GT = all instances)
  seed: 42

foveate:               # any foveate.Config field — full algorithm knob set (mirrors frontend/app.py)
  # --- features ---
  standardize: true               # z-score feature dims before L2-norm
  # --- INSID3 foreground extractor (WHERE is the concept on a crop) ---
  foreground_extractor: insid3    # insid3 (default) | bank — "where is the class" on a crop
  insid3_tau_fg: 0.0                 # fine-grained clustering similarity threshold
  insid3_aggt: 0.1 # alpha: min combined score to merge a cluster into the object
  insid3_crop_reference: true     # crop ref image+mask to each exemplar bbox (scale-match crops)
  insid3_top_k_exemplars: 1       # per crop, run INSID3 on the K bank exemplars most CLS-similar
                                  #   to it (1 = standard single-exemplar INSID3). This is the
                                  #   ALGORITHM's pooling knob; eval.max_exemplars sizes the bank.
  insid3_dynamic_tau_fg: false       # tau = tau_scale * (1 - CLS sim s): dissimilar crop -> fine split
  insid3_dynamic_aggt: false  # aggregate_threshold = aggregate_scale * s: dissimilar crop -> merge freely
                                  #   (overrides the two static values above)
  insid3_tau_fg_scale: 0.7           #   dynamic: tau = tau_scale * (1 - s) (dissimilar -> split fine)
  insid3_aggt_scale: 0.3     #   dynamic: aggregate_threshold = aggregate_scale * s (dissimilar -> merge freely)
  # --- positional debiasing (cross-image matching) ---
  debias: true                    # project out DINOv3 positional bias; enable for cross-image
  debias_subspace_dim: 8          # rank of the positional subspace projected out
  # --- acceptance & splitting (WHAT does a crop contain). A converged crop is ALWAYS split k=2;
  #     the split is kept when its best sub-crop beats the parent, then every sub-crop above
  #     crop_sim_floor is kept. crop_sim_floor is the class FLOOR (below it -> not the class). ---
  crop_sim_floor: 0.1              # reject floor on mean cos(crop CLS, exemplar CLS bank)
  split_mode: kmeans              # kmeans (k=2 on features, always splits) | watershed | none
  zoom_split_retry_eps: 0.01      # a zoom peaking by < eps tries ONE k=2 split of the parent
                                  #   before emitting (it may be a clump); 0 disables
  boundary_smooth_sigma: 0.0      # Gaussian (patches) on watershed maps (split_mode: watershed only)
  # --- duplicate suppression: nested k=2 sub-crops can re-find one object down two branches;
  #     a final NMS keeps the best. Set both to 1.0 to disable. ---
  nms_iou: 0.5                    # suppress a lower-scored leaf above this mask IoU with a kept one
  nms_containment: 0.7            # ...or contained in a kept one beyond this fraction of its area
  # --- recursion / cost ---
  min_crop: 16                    # px size floor — the ONLY geometric stop (no depth cap)
  max_total_embeds: 512           # global embed budget (safety cap)

eval:
  targets: [intra, inter]         # intra = same-image discovery; inter = cross-image (set debias: true)
  max_exemplars: 3                # exemplar prompts drawn from the dataset = bank size (eval
                                  #   protocol knob, NOT an algorithm param; per-crop pooling
                                  #   from the bank is foveate.insid3_top_k_exemplars)
  limit: null
  visualize: 20                   # render prompt|GT|prediction overlays for the first N images
                                  #   (int caps count, true/"all" = every image, false = off);
                                  #   logged to MLflow under {intra,inter}/viz in the run's artifacts
  cascade_trace: 5                # contact sheet of the recursive zoom (gate/components/children)
                                  #   per region, for the first N images; same budget semantics

mlflow:
  enabled: true
  experiment_name: foveate-coco
  # Server connection — all optional; env vars from .env are used as fallback.
  # YAML values take precedence over the environment.
  tracking_uri: null              # overrides MLFLOW_TRACKING_URI; null -> ./mlruns
  username: null                  # overrides MLFLOW_TRACKING_USERNAME
  password: null                  # overrides MLFLOW_TRACKING_PASSWORD
  dotenv: null                    # explicit .env path; null -> looks for ./.env
