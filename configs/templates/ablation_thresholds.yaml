# Ablation: INSID3 clustering threshold x aggregation threshold, on the offline synthetic dataset.
# (Swap the sweep block for `foveate.foreground_extractor: [insid3, bank]` to compare strategies.)
#   python -m experiments.ablations --config configs/ablation_thresholds.yaml
run_name: ablation

backbone:
  type: mock
  image_size: 224
  patch_size: 14

data:
  name: synthetic
  label: synthetic                 # dataset name for MLflow logging/filtering
  categories: []
  min_instances: 2
  train_images: 6
  known_ratio: 0.5
  seed: 0
  options:
    n_images: 6
    image_size: 128
    n_instances: 4
    n_categories: 2

foveate:                    # full algorithm knob set (mirrors frontend/app.py)
  standardize: false        # MockBackbone features are colour-based; z-scoring destroys the signal
  # --- INSID3 foreground extractor (WHERE); tau + aggregate_threshold swept below ---
  foreground_extractor: insid3
  insid3_crop_reference: true
  insid3_top_k_exemplars: 1    # per-crop pooling from the bank (1 = standard INSID3);
                               #   eval.max_exemplars sizes the bank itself
  insid3_dynamic_params: false # derive tau/aggregate from crop↔exemplar CLS sim (overrides sweep)
  insid3_tau_scale: 0.7
  insid3_aggregate_scale: 0.3
  # --- positional debiasing ---
  debias: false             # mock features carry no DINOv3 positional bias
  debias_subspace_dim: 8
  # --- acceptance & splitting (WHAT), held at defaults to isolate the WHERE ablation ---
  cls_threshold: 0.0        # class FLOOR = 0 to isolate the foreground-extraction ablation
  split_mode: kmeans        # kmeans (k=2, always splits) | watershed | none
  zoom_split_retry_eps: 0.01  # near-flat zoom peak retries ONE k=2 split; 0 disables
  boundary_smooth_sigma: 0.0  # Gaussian (patches) on watershed maps (split_mode: watershed only)
  # --- duplicate suppression (final NMS; both 1.0 = off) ---
  nms_iou: 0.5
  nms_containment: 0.7
  # --- recursion / cost ---
  min_crop: 24
  cascade_min_instance_area: 4
  # --- bank extractor only ---
  gate_threshold: 0.4

eval:
  max_exemplars: 2          # exemplar prompts drawn from the dataset = bank size (eval protocol
                            #   knob; per-crop pooling is foveate.insid3_top_k_exemplars)

mlflow:
  enabled: true
  experiment_name: foveate-ablations

sweep:
  foveate.insid3_tau: [0.5, 0.6, 0.7]
  foveate.insid3_aggregate_threshold: [0.1, 0.2, 0.3]
