# Offline smoke test: synthetic coloured-square dataset + weightless mock backbone.
# Runs end-to-end with no downloads and no DINOv3 weights:
#   python -m experiments.run --config configs/mock_smoke.yaml
run_name: mock_smoke

backbone:
  type: mock
  image_size: 224
  patch_size: 14

data:
  name: synthetic
  label: synthetic                 # dataset name for MLflow logging/filtering
  categories: []          # all colour categories
  min_instances: 2
  train_images: 6         # intra pool (same-image discovery)
  interval_images: 3      # disjoint novel images for cross-image (inter) eval
  known_ratio: 0.5
  seed: 0
  options:
    n_images: 9
    image_size: 128
    n_instances: 4
    n_categories: 2

foveate:                    # full algorithm knob set (mirrors frontend/app.py)
  standardize: false        # MockBackbone features are colour-based; z-scoring destroys the signal
  # --- INSID3 foreground extractor (WHERE) ---
  foreground_extractor: insid3   # insid3 (default) | bank
  insid3_tau_fg: 0.6
  insid3_aggt: 0.2
  insid3_crop_reference: true
  insid3_top_k_exemplars: 1    # per-crop pooling from the bank (1 = standard INSID3);
                               #   eval.max_exemplars sizes the bank itself
  insid3_dynamic_tau_fg: false       # tau = tau_scale * (1 - CLS sim s): dissimilar crop -> fine split
  insid3_dynamic_aggt: false  # aggregate_threshold = aggregate_scale * s: dissimilar crop -> merge freely
  insid3_tau_fg_scale: 0.7
  insid3_aggt_scale: 0.3
  # --- positional debiasing ---
  debias: false             # mock features carry no DINOv3 positional bias
  debias_subspace_dim: 8
  # --- acceptance & splitting (WHAT) ---
  crop_sim_floor: 0.0        # class FLOOR; 0.0 = never reject on it (mock CLS is coarse)
  split_mode: kmeans        # kmeans (k=2, always splits) | watershed | none
  zoom_split_retry_eps: 0.01  # near-flat zoom peak retries ONE k=2 split; 0 disables
  boundary_smooth_sigma: 0.0  # Gaussian (patches) on watershed maps (split_mode: watershed only)
  # --- duplicate suppression (final NMS; both 1.0 = off) ---
  nms_iou: 0.5
  nms_containment: 0.7
  # --- recursion / cost ---
  min_crop: 24
  cascade_min_instance_area: 4
  # --- bank extractor only ---
  gate_threshold: 0.4
  prototype_reduction: all

eval:
  targets: [intra, inter]   # intra = same-image discovery; inter = cross-image
  max_exemplars: 2          # exemplar prompts drawn from the dataset = bank size (eval protocol
                            #   knob; per-crop pooling is foveate.insid3_top_k_exemplars)
  limit: null
  visualize: all            # int caps count, true/"all" renders every image, false disables
  cascade_trace: 2          # contact sheet of the recursive zoom (same budget semantics)

mlflow:
  enabled: false          # flip to true to log to ./mlruns
  experiment_name: foveate-smoke
