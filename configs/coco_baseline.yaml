# Baseline foveate run on a COCO subset (coral or any category).
# Requires the [dino] extra and a downloaded COCO dataset; DINOv3 weights are HF-gated.
run_name: coco_baseline

backbone:
  type: dino
  model_id: facebook/dinov3-vits16-pretrain-lvd1689m
  image_size: 768

data:
  name: coco
  root: /data/coco
  annotation_file: annotations/instances_train2017.json
  images_dir: train2017
  categories: [person]
  min_instances: 2
  train_images: 20        # intra pool (same-image discovery)
  interval_images: 10     # disjoint novel images for cross-image (inter) eval
  known_ratio: 0.3        # fraction of instances used as known/prompts (intra GT = all instances)
  seed: 42

foveate:               # any foveate.Config field
  standardize: true
  foreground_extractor: insid3    # insid3 (default) | bank — "where is the class" on a crop
  # --- INSID3 foreground extractor (WHERE) ---
  insid3_tau: 0.6                 # fine-grained clustering similarity threshold
  insid3_aggregate_threshold: 0.2 # alpha: min combined score to merge a cluster into the object
  insid3_crop_reference: true     # crop ref image+mask to each exemplar bbox (scale-match crops)
  # --- acceptance & splitting (WHAT): a converged crop is kept as ONE instance unless
  #     splitting makes the sub-crops MORE exemplar-like (then it was a clump). cls_threshold
  #     is the class FLOOR — a converged crop below it is not the class and is rejected. ---
  cls_threshold: 0.2              # reject floor on mean cos(crop CLS, exemplar CLS bank)
  split_aggregate: mean           # mean | max | min — how sub-crop CLS is pooled vs the parent
  split_margin: 0.0               # keep a split only if pooled child CLS beats the parent by this
  boundary_smooth_sigma: 0.0      # Gaussian (patches) smoothing watershed maps; >0 = fewer fragments
  # --- recursion / cost ---
  min_crop: 64
  max_total_embeds: 512
  debias: false                   # project out DINOv3 positional bias; enable for cross-image
  # --- bank extractor only (used when foreground_extractor: bank) ---
  gate_threshold: 0.5
  gate_threshold_mode: static     # static | otsu | gmm2 | percentile
  prototype_reduction: kmeans     # all | mean | cluster | kmeans
  prototype_budget: 64

eval:
  targets: [intra, inter]         # intra = same-image discovery; inter = cross-image (set debias: true)
  max_exemplars: 3
  limit: null
  visualize: 20                   # render prompt|GT|prediction overlays for the first N images
                                  #   (int caps count, true/"all" = every image, false = off);
                                  #   logged to MLflow under {intra,inter}/viz in the run's artifacts
  cascade_trace: 5                # contact sheet of the recursive zoom (gate/components/children)
                                  #   per region, for the first N images; same budget semantics

mlflow:
  enabled: true
  experiment_name: foveate-coco
  # Server connection — all optional; env vars from .env are used as fallback.
  # YAML values take precedence over the environment.
  tracking_uri: null              # overrides MLFLOW_TRACKING_URI; null -> ./mlruns
  username: null                  # overrides MLFLOW_TRACKING_USERNAME
  password: null                  # overrides MLFLOW_TRACKING_PASSWORD
  dotenv: null                    # explicit .env path; null -> looks for ./.env
